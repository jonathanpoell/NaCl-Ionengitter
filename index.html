<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NaCl-Ionengitter – 3D-Modell</title><style>body{margin:0;font:16px system-ui,sans-serif;background:#f5f7fa;color:#192331}.wrap{max-width:1100px;margin:auto;padding:20px}h1{margin:0 0 8px;font-size:26px}p{margin:8px 0 16px}.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:14px;background:white;border-radius:12px;margin-bottom:12px}.controls label{display:flex;gap:9px;align-items:center}input[type=range]{width:180px}button{background:#263d63;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}button:focus-visible{outline:3px solid orange}#stage{display:block;width:100%;height:min(65vh,640px);min-height:360px;background:radial-gradient(ellipse at 50% 35%,#2b4058,#101824 80%);border-radius:12px;touch-action:none;cursor:grab}.legend{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap}.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:5px}.note{font-size:14px;color:#49566b}</style></head><body><main class="wrap"><h1>NaCl-Ionengitter – interaktives 3D-Modell</h1><p>Ziehe mit der Maus, um den Kristall zu drehen. Zoome mit dem Mausrad.</p><div class="controls"><label for="layers">Sichtbare Schichten <input id="layers" type="range" min="1" max="4" step="1" value="1"><strong id="count">1</strong></label><label><input id="neighbors" type="checkbox"> Koordinationszahl 6 hervorheben</label><button id="reset">Ansicht zurücksetzen</button></div><canvas id="stage" aria-label="Drehbares dreidimensionales Natriumchlorid-Ionengitter"></canvas><div class="legend"><span><i class="dot" style="background:#a591d2"></i>Na⁺ (kleiner)</span><span><i class="dot" style="background:#7dbe87"></i>Cl⁻ (größer)</span></div><p class="note" id="info">Schicht 1 von 4. Die Darstellung ist ein schematischer Kristallausschnitt; Randionen haben weniger Nachbarn.</p></main><script>
(()=>{'use strict';const cv=document.getElementById('stage'),ctx=cv.getContext('2d'),sl=document.getElementById('layers'),count=document.getElementById('count'),cb=document.getElementById('neighbors'),info=document.getElementById('info');let ax=-0.48,ay=0.65,zoom=1,drag=false,lastX=0,lastY=0;const ions=[];for(let z=0;z<4;z++)for(let y=0;y<4;y++)for(let x=0;x<4;x++)ions.push({x,y,z,cl:(x+y+z)%2===0});const center={x:1,y:1,z:1};function proj(p,w,h,scale){let X=p.x-1.5,Y=p.y-1.5,Z=p.z-1.5;let a=X*Math.cos(ay)+Z*Math.sin(ay),b=-X*Math.sin(ay)+Z*Math.cos(ay);let v=Y*Math.cos(ax)-b*Math.sin(ax),depth=Y*Math.sin(ax)+b*Math.cos(ax);return {sx:w/2+a*scale,sy:h/2-v*scale,depth}}function render(){const dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);let scale=Math.min(w/6.8,h/6.2)*zoom,n=+sl.value,show=cb.checked&&n===4;let points=ions.filter(p=>p.z<n).map(p=>({...p,...proj(p,w,h,scale)}));let target=points.find(p=>p.x===center.x&&p.y===center.y&&p.z===center.z);let nearby=p=>Math.abs(p.x-center.x)+Math.abs(p.y-center.y)+Math.abs(p.z-center.z)===1; if(show&&target){ctx.lineWidth=2;ctx.strokeStyle='rgba(255,217,91,.75)';for(let p of points.filter(nearby)){ctx.beginPath();ctx.moveTo(target.sx,target.sy);ctx.lineTo(p.sx,p.sy);ctx.stroke()}}points.sort((a,b)=>a.depth-b.depth);for(let p of points){let r=(p.cl?.46:.30)*scale;let active=show&&(p===target||(p.x===1&&p.y===1&&p.z===1)||nearby(p));let dim=show&&!active;ctx.globalAlpha=dim?.16:1;let rgb=p.cl?[125,190,135]:[165,145,210],g=ctx.createRadialGradient(p.sx-r*.35,p.sy-r*.42,r*.05,p.sx,p.sy,r);g.addColorStop(0,`rgb(${rgb.map(v=>Math.min(255,v+65)).join(',')})`);g.addColorStop(.62,`rgb(${rgb.join(',')})`);g.addColorStop(1,`rgb(${rgb.map(v=>Math.round(v*.45)).join(',')})`);ctx.beginPath();ctx.arc(p.sx,p.sy,r,0,2*Math.PI);ctx.fillStyle=g;ctx.fill();if(active){ctx.strokeStyle='#ffdc63';ctx.lineWidth=2.5;ctx.stroke()}if(r>13){ctx.fillStyle='#172332';ctx.font=`bold ${Math.max(10,Math.min(16,r*.55))}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.cl?'Cl⁻':'Na⁺',p.sx,p.sy)}ctx.globalAlpha=1}count.textContent=n;info.textContent=show?'Markiert: das zentrale Cl⁻-Ion bei (1,1,1) und seine sechs nächsten Na⁺-Nachbarn.':`Schicht ${n} von 4. Die Darstellung ist ein schematischer Kristallausschnitt; Randionen haben weniger Nachbarn.`}cv.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;ay+=(e.clientX-lastX)*.009;ax+=(e.clientY-lastY)*.009;lastX=e.clientX;lastY=e.clientY;render()});cv.addEventListener('pointerup',()=>drag=false);cv.addEventListener('pointercancel',()=>drag=false);cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2.5,zoom*Math.exp(-e.deltaY*.001)));render()},{passive:false});sl.addEventListener('input',()=>{if(+sl.value<4)cb.checked=false;cb.disabled=+sl.value<4;render()});cb.disabled=true;cb.addEventListener('change',render);document.getElementById('reset').addEventListener('click',()=>{ax=-.48;ay=.65;zoom=1;render()});new ResizeObserver(render).observe(cv);render()})();
</script></body></html>
